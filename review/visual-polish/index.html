<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VesselRisk — 視覺精修前後比較</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f6;color:#163548;font:15px/1.6 system-ui,"Microsoft JhengHei",sans-serif}header,main{max-width:1960px;margin:auto;padding:24px 32px}header{padding-bottom:12px}h1{font-size:28px;margin:4px 0}p{margin:8px 0;color:#506b7b}.controls{display:flex;align-items:end;gap:16px;flex-wrap:wrap;background:white;border:1px solid #d7e3e9;border-radius:8px;padding:16px;margin:16px 0}label{display:grid;gap:5px;font-size:13px}button,select{font:inherit;color:inherit;padding:9px 14px;border:1px solid #aebfc8;background:white;border-radius:5px}button{cursor:pointer}button[aria-pressed=true]{background:#163548;color:white}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #128c88;outline-offset:3px}.switch{display:flex;gap:6px}.frames{display:grid;grid-template-columns:1fr;gap:20px}.frames.pair{grid-template-columns:1fr 1fr}figure{margin:0;min-width:0}figcaption{display:flex;justify-content:space-between;padding:8px 2px;font-weight:600}img{display:block;width:100%;height:auto;border:1px solid #d7e3e9;background:white}a{color:#147976}small{font-weight:400}footer{padding:24px 0;color:#506b7b;font-size:13px}[hidden]{display:none!important}@media(max-width:760px){header,main{padding:18px}.frames.pair{grid-template-columns:1fr}h1{font-size:23px}}
</style>
<header><h1>VesselRisk：視覺精修前後比較</h1><p>真實產品截圖。相同病例、操作與視窗尺寸；模型、數值、科學說明及解剖映射保持原樣。FPS 與回應時間為每次執行的即時測量。</p></header>
<main>
<div class="controls">
  <label>錄影尺寸<select id="size"><option value="1440">1440 × 1000</option><option value="1920">1920 × 1080</option></select></label>
  <label>示範狀態<select id="state">
  <option value="workspace">主畫面 / LAD</option><option value="explanation">局部 SHAP 解釋</option><option value="lcx-xray">LCX / X-ray</option><option value="rca-isolated">RCA / 血管隔離</option><option value="validation">Evidence Lab / CAD 驗證</option><option value="comparisons">模型比較 / 混淆矩陣</option><option value="thresholds">LCX / 操作閾值比較</option><option value="global-shap">全域 SHAP</option><option value="robustness">Robustness / 子群檢查</option><option value="provenance">資料來源 / Leakage audit</option><option value="failure">Held-out failure case</option><option value="second-patient">第二位病人</option><option value="stale">修改輸入 / 舊結果提示</option>
  </select></label>
  <div class="switch" role="group" aria-label="比較方式"><button data-mode="before" aria-pressed="false">Before</button><button data-mode="after" aria-pressed="true">After</button><button data-mode="pair" aria-pressed="false">並排比較</button></div>
</div>
<div class="frames" id="frames">
  <figure id="before" hidden><figcaption>BEFORE <a id="before-link" target="_blank" rel="noreferrer">原尺寸 PNG</a></figcaption><img id="before-image" alt="修改前的 VesselRisk 畫面"></figure>
  <figure id="after"><figcaption>AFTER <a id="after-link" target="_blank" rel="noreferrer">原尺寸 PNG</a></figcaption><img id="after-image" alt="精修後的 VesselRisk 畫面"></figure>
</div>
<footer>每版 26 張實拍。表格與解釋為元件截圖，其餘為視窗截圖；較長內容仍可在產品中捲動。<a href="../../docs/VISUAL_POLISH.md">完整視覺審查、驗證與還原說明</a> · <a href="before-source.zip">修改前原始檔備份</a></footer>
</main>
<script>
let mode='after';const byId=id=>document.getElementById(id);
function render(){const name=byId('size').value+'-'+byId('state').value+'.png';for(const phase of ['before','after']){const url=phase+'/'+name;byId(phase+'-image').src=url;byId(phase+'-link').href=url;byId(phase).hidden=mode!=='pair'&&mode!==phase;}byId('frames').classList.toggle('pair',mode==='pair');for(const b of document.querySelectorAll('[data-mode]'))b.setAttribute('aria-pressed',String(b.dataset.mode===mode));}
for(const id of ['size','state'])byId(id).addEventListener('change',render);
for(const b of document.querySelectorAll('[data-mode]'))b.addEventListener('click',()=>{mode=b.dataset.mode;render();});render();
</script>
</html>
